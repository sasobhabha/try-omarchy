name: TryOmarchy
options:
  bundleIdPrefix: dev.tryomarchy
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    SUPPORTED_PLATFORMS: iphoneos
    SUPPORTS_MACCATALYST: NO
packages:
  TryOmarchyCore:
    path: .
targets:
  TryOmarchy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - TryOmarchy.entitlements
      - path: runtime/jit
      - path: runtime/support
      - path: Resources/guest
        type: folder
        buildPhase: resources
      - path: Resources/firmware
        type: folder
        buildPhase: resources
    dependencies:
      - package: TryOmarchyCore
        product: TryOmarchyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tryomarchy.ios
        PRODUCT_NAME: TryOmarchy
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TryOmarchy.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/TryOmarchy-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    configFiles:
      Debug: Config/Runtime.xcconfig
      Release: Config/Runtime.xcconfig
    postBuildScripts:
      - name: Copy simulator QEMU
        basedOnDependencyAnalysis: false
        script: |
          keymap_source=""
          if [[ -f ${SRCROOT}/.build/utm/qemu-share/keymaps/en-us ]]; then
            keymap_source="${SRCROOT}/.build/utm/qemu-share/keymaps"
          else
            for candidate in "${SRCROOT}"/.build/src/qemu-*/pc-bios/keymaps; do
              if [[ -f ${candidate}/en-us ]]; then
                keymap_source="${candidate}"
                break
              fi
            done
          fi
          if [[ -n ${keymap_source} ]]; then
            mkdir -p "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/qemu-share"
            rm -rf "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/qemu-share/keymaps"
            cp -R "${keymap_source}" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/qemu-share/keymaps"
          elif [[ ${PLATFORM_NAME} == iphoneos ]]; then
            echo "error: device QEMU needs keymaps/en-us so the display can open"
            exit 1
          fi
          if [[ ${PLATFORM_NAME} != iphonesimulator ]]; then
            exit 0
          fi
          source="${SRCROOT}/.build/utm/Frameworks"
          destination="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Frameworks"
          if [[ ! -d ${source} ]]; then
            echo "warning: simulator QEMU is not staged. Run make ios-simulator-qemu."
            exit 0
          fi
          mkdir -p "${destination}"
          cp -f "${source}"/*.dylib "${destination}/"
          share="${SRCROOT}/.build/utm/qemu-share"
          if [[ -d ${share}/keymaps ]]; then
            mkdir -p "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/qemu-share"
            cp -R "${share}/keymaps" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/qemu-share/"
          fi
schemes:
  TryOmarchy:
    build:
      targets:
        TryOmarchy: all
    run:
      config: Debug
